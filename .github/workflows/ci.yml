name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-ssg-0.0.48

      - name: Install ssg CLI
        run: |
          which ssg || cargo install static-site-generator --version 0.0.48

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site with ssg
        run: npm run build

      - name: Validate locale content
        run: node scripts/validate-all-locales.mjs

      - name: Audit full compliance (SEO, WCAG AAA, Mobile)
        run: node scripts/audit-full-compliance.mjs
