name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]

# Build and audit only: read the repository, nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install the latest ssg
        uses: ./.github/actions/setup-ssg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site with ssg
        run: npm run build

      - name: Run test suite against built output
        run: npm test

      - name: Validate locale content
        run: node scripts/validate-all-locales.mjs

      - name: Audit full compliance (SEO, WCAG AAA, Mobile)
        run: node scripts/audit-full-compliance.mjs
