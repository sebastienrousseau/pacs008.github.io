name: CI

on:
  push:
    branches: ["feat/**"]
  pull_request:
    branches: [main, "feat/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ssg CLI
        run: cargo install static-site-generator --version 0.0.48 || true

      - name: Build site with ssg
        run: ssg build -f config.toml

      - name: Run ssg validators
        run: ssg check -f config.toml

